[project]
site_name = "nTails"
site_url = "https://ntails.default.horse/"
site_description = "An unofficial Tailscale client for reaching several tailnets at once."
repo_url = "https://github.com/dylanwh/nTails"
repo_name = "dylanwh/nTails"

nav = [
  { "Overview" = "index.md" },
  { "RPC protocol" = "rpc-protocol.md" },
]

[project.theme]
favicon = "favicon.svg"
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.magiclink = {}
pymdownx.superfences = {}
