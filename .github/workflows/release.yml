name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  ntailsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ntailsd/go.mod
      # ntailsd has no cgo dependencies; one Linux runner builds every target.
      - run: ci/build-release.sh "$GITHUB_REF_NAME"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
