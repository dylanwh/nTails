name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ntailsd:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ntailsd
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ntailsd/go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: CGO_ENABLED=0 go build -o /dev/null .
